name: Build Windows desktop installer (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create unsigned .env.windows
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://example.com
          DSH_DESKTOP_WINDOWS_CER_FILE=
          DSH_DESKTOP_WINDOWS_SIGNTOOL=
          DSH_DESKTOP_WINDOWS_KEY_CONTAINER=
          DSH_DESKTOP_WINDOWS_TOKEN_PIN=
          '@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8

      - name: Build (native + lib + web)
        run: pnpm build

      - name: Build Electron shell
        run: pnpm build:desktop

      - name: Package unsigned Windows installer
        run: pnpm package:desktop:win:x64:unsigned

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-win-x64-installer
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
